name: Hosted immutable LidSwitch repair candidate

on:
  workflow_dispatch:
    inputs:
      reviewed_orchestration_sha:
        description: Exact reviewed main commit SHA (40 lowercase hex)
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-candidate:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out reviewed orchestration bytes
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: orchestration
          persist-credentials: false
          fetch-depth: 1
      - name: Check out detached repaired source only
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.repository }}
          ref: 6200836869591acb4bf65edb825eb62e84b56f87
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Fail closed on any non-reviewed runner or toolchain
        shell: /bin/bash -euo pipefail {0}
        run: |
          export DEVELOPER_DIR=/Library/Developer/CommandLineTools
          export PATH=/usr/bin:/bin:/usr/sbin:/sbin
          test "$(/usr/bin/uname -m)" = arm64
          test "$(/usr/sbin/sysctl -n kern.osversion)" = 25E246
          test "${ImageVersion:?missing ImageVersion}" = 20260720.0258.1
          test -x /Library/Developer/CommandLineTools/usr/bin/swift
          test "$(DEVELOPER_DIR=/Library/Developer/CommandLineTools /usr/bin/xcrun --sdk macosx --show-sdk-path)" = /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk
          DEVELOPER_DIR=/Library/Developer/CommandLineTools /usr/bin/xcrun --sdk macosx --show-sdk-version > "$RUNNER_TEMP/sdk-version"
          /usr/bin/sw_vers > "$RUNNER_TEMP/sw-vers"
      - name: Verify pinned orchestration bootstrap before any authority exists
        env:
          REVIEWED_ORCHESTRATION_SHA: ${{ inputs.reviewed_orchestration_sha }}
        shell: /bin/bash -euo pipefail {0}
        run: |
          cd "$GITHUB_WORKSPACE/orchestration"
          test "${GITHUB_REPOSITORY:?}" = johnsilvavlogs/lidswitch
          test "${GITHUB_EVENT_NAME:?}" = workflow_dispatch
          test "${GITHUB_REF:?}" = refs/heads/main
          test "$REVIEWED_ORCHESTRATION_SHA" = "${GITHUB_SHA:?}"
          case "$REVIEWED_ORCHESTRATION_SHA" in [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;; *) exit 74 ;; esac
          test "$(/usr/bin/git rev-parse HEAD)" = "${GITHUB_SHA:?}"
          test "$(/usr/bin/git show -s --format=%T "$GITHUB_SHA")" = "$(/usr/bin/git rev-parse HEAD^{tree})"
          origin=$(/usr/bin/git config --get remote.origin.url)
          test "$origin" = "https://github.com/${GITHUB_REPOSITORY}" -o "$origin" = "https://github.com/${GITHUB_REPOSITORY}.git" -o "$origin" = "git@github.com:${GITHUB_REPOSITORY}.git"
          test -z "$(/usr/bin/git status --porcelain=v1 --untracked-files=all)"
          test "$(/usr/bin/shasum -a 256 orchestration/hosted_held_bootstrap.py | /usr/bin/awk '{print $1}')" = 18581edae191a3ee20baaab6ca959440f049109cfc7288aaaf21df0fc2ea1007
          test "$(/usr/bin/shasum -a 256 orchestration/hosted-runner-policy.json | /usr/bin/awk '{print $1}')" = cadfbe8f227900cdc505f256729d73f6269e4b946717609feeb3c1420fc1012c
          test "$(/usr/bin/shasum -a 256 orchestration/collect_hosted_candidate_evidence.py | /usr/bin/awk '{print $1}')" = 0dd17112edae46f81d59a8aac71ba004354dbfab240da66421d0183d3591dcfa
          test "$(/usr/bin/shasum -a 256 orchestration/verify_hosted_candidate_evidence.py | /usr/bin/awk '{print $1}')" = cded10a96b5d4c2b0cd27fa6fc7d3e254fb38c03e5b68fd393400821c3377a84
          /usr/bin/python3 -m py_compile orchestration/hosted_held_bootstrap.py orchestration/collect_hosted_candidate_evidence.py
      - name: Create runner-specific held authority after exact source verification
        shell: /bin/bash -euo pipefail {0}
        run: |
          /usr/bin/python3 -I -S -B "$GITHUB_WORKSPACE/orchestration/orchestration/hosted_held_bootstrap.py" prepare \
            --source "$GITHUB_WORKSPACE/source" --authority "$RUNNER_TEMP/lidswitch-hosted-authority" \
            --policy "$GITHUB_WORKSPACE/orchestration/orchestration/hosted-runner-policy.json" | tee "$RUNNER_TEMP/authority-prepare.json"
      - name: Run only the descriptor-held unchanged release wrapper
        shell: /bin/bash -euo pipefail {0}
        run: |
          expected_args=$(/usr/bin/python3 -I -S -B -c 'import json,sys; p=json.load(open(sys.argv[1])); print(" ".join("--expected-%s-sha256 %s --expected-%s-size %s"%(n,p[n]["sha256"],n,p[n]["size"]) for n in ("ledger","entry","contract")))' "$RUNNER_TEMP/authority-prepare.json")
          /usr/bin/python3 -I -S -B "$GITHUB_WORKSPACE/orchestration/orchestration/hosted_held_bootstrap.py" build \
            --source "$GITHUB_WORKSPACE/source" --authority "$RUNNER_TEMP/lidswitch-hosted-authority" \
            --policy "$GITHUB_WORKSPACE/orchestration/orchestration/hosted-runner-policy.json" $expected_args | tee "$RUNNER_TEMP/held-build.json"
      - name: Capture and package the retained held output without rebuilding
        env:
          REVIEWED_ORCHESTRATION_SHA: ${{ inputs.reviewed_orchestration_sha }}
        shell: /bin/bash -euo pipefail {0}
        run: |
          release_output=$(/usr/bin/python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["release_output"])' "$RUNNER_TEMP/held-build.json")
          package_parent=$(/usr/bin/mktemp -d "$RUNNER_TEMP/lidswitch-package.XXXXXX")
          /usr/bin/python3 -I -S -B "$GITHUB_WORKSPACE/orchestration/orchestration/hosted_held_bootstrap.py" package --source "$GITHUB_WORKSPACE/source" --authority "$RUNNER_TEMP/lidswitch-hosted-authority" --policy "$GITHUB_WORKSPACE/orchestration/orchestration/hosted-runner-policy.json" --release-output "$release_output" --package-parent "$package_parent" | tee "$RUNNER_TEMP/candidate.json"
          candidate_root=$(/usr/bin/python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["candidate_root"])' "$RUNNER_TEMP/candidate.json")
          /usr/bin/python3 -c 'import hashlib,json,os,sys; policy,workflow,out,release,package,candidate=sys.argv[1:]; sha=lambda p: hashlib.sha256(open(p,"rb").read()).hexdigest(); value={"schema":"lidswitch-hosted-workflow-context-v2","source_commit":"6200836869591acb4bf65edb825eb62e84b56f87","source_tree":"d86650eccfe3326fc968fc855a07a1e3d06aaf57","orchestration_commit_sha":os.environ["GITHUB_SHA"],"workflow_file_sha256":sha(workflow),"workflow_ref":os.environ["GITHUB_REF"],"reviewed_orchestration_sha":os.environ["REVIEWED_ORCHESTRATION_SHA"],"run_id":os.environ["GITHUB_RUN_ID"],"run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],"image_version":os.environ["ImageVersion"],"policy_sha256":sha(policy),"release_output":release,"package_parent":package,"candidate_root":candidate,"sdk_version":open(os.environ["RUNNER_TEMP"]+"/sdk-version").read().strip(),"driver_sha256":sha("/Library/Developer/CommandLineTools/usr/bin/swift-frontend")}; open(out,"wb").write(json.dumps(value,sort_keys=True,separators=(",",":")).encode()+b"\n")' "$GITHUB_WORKSPACE/orchestration/orchestration/hosted-runner-policy.json" "$GITHUB_WORKSPACE/orchestration/.github/workflows/hosted-immutable-candidate.yml" "$RUNNER_TEMP/workflow-context.json" "$release_output" "$package_parent" "$candidate_root"
          /usr/bin/python3 -I -S -B "$GITHUB_WORKSPACE/orchestration/orchestration/collect_hosted_candidate_evidence.py" --source "$GITHUB_WORKSPACE/source" --orchestration "$GITHUB_WORKSPACE/orchestration" --authority "$RUNNER_TEMP/lidswitch-hosted-authority" --package-parent "$package_parent" --candidate-root "$candidate_root" --release-output "$release_output" --workflow-context "$RUNNER_TEMP/workflow-context.json" --prepare-receipt "$RUNNER_TEMP/authority-prepare.json" --build-receipt "$RUNNER_TEMP/held-build.json" --output "$RUNNER_TEMP/lidswitch-hosted-evidence" | tee "$RUNNER_TEMP/evidence.json"
          /usr/bin/python3 -I -S -B "$GITHUB_WORKSPACE/orchestration/orchestration/verify_hosted_candidate_evidence.py" --evidence "$RUNNER_TEMP/lidswitch-hosted-evidence"
      - name: Upload the one immutable evidence bundle
        id: evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lidswitch-v0.2.13-build8-hosted-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lidswitch-hosted-evidence
          if-no-files-found: error
          compression-level: 0
      - name: Record GitHub's uploaded artifact digest in the run summary
        shell: /bin/bash -euo pipefail {0}
        run: |
          printf '%s\n' "artifact-id=${{ steps.evidence.outputs.artifact-id }}" "artifact-digest=${{ steps.evidence.outputs.artifact-digest }}" >> "$GITHUB_STEP_SUMMARY"
